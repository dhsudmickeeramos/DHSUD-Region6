<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHSUD Region VI · Add Employee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="gov-topbar">
    <div class="gov-topbar-inner">
        <span><i class="fas fa-flag"></i> Republic of the Philippines</span>
        <span class="gov-topbar-right">Department of Human Settlements and Urban Development · Region VI</span>
    </div>
</div>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <img src="https://raw.githubusercontent.com/dhsudmickeeramos/DHSUD-Region6/main/DHSUD_LOGO.png" alt="DHSUD Logo" class="gov-logo" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='inline-flex';">
            <span id="logoFallback" class="gov-logo-fallback" style="display:none;"><i class="fas fa-building"></i></span>
            <div class="logo-text">
                <h1>DHSUD Region VI</h1>
                <p>Human Resource Management · Employee Records</p>
            </div>
        </div>
        
        <div class="nav-menu">
            <a href="index.html" class="btn-secondary"><i class="fas fa-list-ul"></i> Employee List</a>
            <a href="add_employee.html" class="btn-secondary active-nav"><i class="fas fa-user-plus"></i> Add Employee</a>
            <a href="payslip.html" class="btn-secondary"><i class="fas fa-file-invoice-dollar"></i> Generate Payslip</a>
        </div>
    </div>

    <div class="gold-bar"></div>

    <div class="form-card">
        <h2><i class="fas fa-user-plus"></i> Add New Employee</h2>
        <form id="employeeForm">
            <div class="form-grid">
                <div class="section-label"><i class="fas fa-id-card"></i> Personal Information</div>
                <div class="form-group"><label><i class="fas fa-user"></i> Complete Name</label><input type="text" id="fullName" placeholder="e.g. Juan A. Dela Cruz" required></div>
                <div class="form-group"><label><i class="fas fa-home"></i> Address</label><input type="text" id="address" placeholder="Street, City, Province" required></div>
                <div class="form-group"><label><i class="fas fa-birthday-cake"></i> Birthday</label><input type="date" id="birthday" required></div>
                <div class="form-group">
                    <label><i class="fas fa-tint"></i> Blood Type</label>
                    <select id="bloodType" required>
                        <option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                    </select>
                </div>
                <div class="form-group"><label><i class="fas fa-phone-alt"></i> Contact Number</label><input type="tel" id="contactNo" placeholder="e.g. 0917 123 4567" required></div>
                <div class="form-group"><label><i class="fas fa-user-friends"></i> Emergency Contact Person</label><input type="text" id="emergencyPerson" placeholder="Full name" required></div>
                <div class="form-group"><label><i class="fas fa-phone-square-alt"></i> Emergency Contact No.</label><input type="tel" id="emergencyNo" placeholder="e.g. 0918 987 6543" required></div>

                <div class="section-label"><i class="fas fa-briefcase"></i> Employment & Professional Info</div>
                <div class="form-group"><label><i class="fas fa-user-tie"></i> Position</label><input type="text" id="position" placeholder="e.g. Administrative Officer" required></div>
                <div class="form-group"><label><i class="fas fa-layer-group"></i> Salary Grade</label><input type="text" id="salaryGrade" placeholder="e.g. SG-11" required></div>
                <div class="form-group"><label><i class="fas fa-money-bill-wave"></i> Salary</label><input type="number" id="salary" step="0.01" placeholder="e.g. 25000.00" required></div>
                <div class="form-group"><label><i class="fas fa-sitemap"></i> Division</label><input type="text" id="division" placeholder="e.g. Administrative Division" required></div>
                <div class="form-group">
                    <label><i class="fas fa-check-circle"></i> Employment Status</label>
                    <select id="employmentStatus" required>
                        <option value="">Select</option><option>Permanent</option><option>Contractual</option><option>Job Order</option><option>Casual</option><option>Project Based</option>
                    </select>
                </div>
                <div class="form-group"><label><i class="fas fa-calendar-alt"></i> Start Date</label><input type="date" id="startDate" required></div>
                
                <!-- New Fields -->
                <div class="form-group"><label><i class="fas fa-graduation-cap"></i> Profession</label><input type="text" id="profession" placeholder="e.g. Civil Engineer"></div>
                <div class="form-group"><label><i class="fas fa-id-badge"></i> PRC No.</label><input type="text" id="prcNo" placeholder="e.g. 0012345"></div>

                <div class="section-label"><i class="fas fa-id-card-alt"></i> Government Numbers</div>
                <div class="form-group"><label><i class="fas fa-key"></i> GSIS No.</label><input type="text" id="gsisNo" placeholder="e.g. 1234-5678-90" required></div>
                <div class="form-group"><label><i class="fas fa-shield-alt"></i> SSS No.</label><input type="text" id="sssNo" placeholder="e.g. 34-1234567-8" required></div>
                <div class="form-group"><label><i class="fas fa-file-invoice"></i> TIN No.</label><input type="text" id="tinNo" placeholder="e.g. 123-456-789-000" required></div>
                <div class="form-group"><label><i class="fas fa-piggy-bank"></i> Pag-IBIG No.</label><input type="text" id="pagibigNo" placeholder="e.g. 1234-5678-9012" required></div>
                <div class="form-group"><label><i class="fas fa-heartbeat"></i> PhilHealth Number</label><input type="text" id="philhealthNo" placeholder="e.g. 12-345678901-2" required></div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <i class="fas fa-save"></i> Save Employee
            </button>
        </form>
    </div>
</div>

<div id="toast" class="toast"></div>
<div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyXu6iWw1Bp4TqR9toiWbCjGRhwKAkMrzSqBB0x6diHP36lz4Imk0LLRx77nbWstIZ6jw/exec';
    const form = document.getElementById('employeeForm');
    const submitBtn = document.getElementById('submitBtn');
    const toastEl = document.getElementById('toast');
    const loadingOverlay = document.getElementById('loadingOverlay');

    function showToast(message, type = 'info') {
        toastEl.className = `toast ${type}`;
        const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
        toastEl.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 3500);
    }

    function setLoading(active) { loadingOverlay.classList.toggle('active', active); }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Note: We map the IDs to the EXACT column names in your Google Sheet
        const payload = {
            action: 'add',
            'Complete Name': document.getElementById('fullName').value.trim(),
            'Address': document.getElementById('address').value.trim(),
            'Birthday': document.getElementById('birthday').value,
            'Blood Type': document.getElementById('bloodType').value,
            'Contact Number': document.getElementById('contactNo').value.trim(),
            'Emergency Person': document.getElementById('emergencyPerson').value.trim(),
            'Emergency No.': document.getElementById('emergencyNo').value.trim(),
            'Position': document.getElementById('position').value.trim(),
            'Salary Grade': document.getElementById('salaryGrade').value.trim(),
            'Salary': document.getElementById('salary').value,
            'Division': document.getElementById('division').value.trim(),
            'Employment Status': document.getElementById('employmentStatus').value,
            'Start Date': document.getElementById('startDate').value,
            'Profession': document.getElementById('profession').value.trim(),
            'PRC No.': document.getElementById('prcNo').value.trim(),
            'GSIS No.': document.getElementById('gsisNo').value.trim(),
            'SSS No.': document.getElementById('sssNo').value.trim(),
            'TIN No.': document.getElementById('tinNo').value.trim(),
            'Pag-IBIG No.': document.getElementById('pagibigNo').value.trim(),
            'PhilHealth No.': document.getElementById('philhealthNo').value.trim()
        };

        submitBtn.disabled = true;
        setLoading(true);
        try {
            const body = new URLSearchParams(payload);
            const res = await fetch(API_URL, {
                method: 'POST',
                body,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            });
            const json = await res.json();
            
            if (json.success) {
                showToast('Employee added successfully! Redirecting...', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            } else {
                showToast('Add failed: ' + (json.message || 'unknown error'), 'error');
            }
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        } finally {
            submitBtn.disabled = false;
            setLoading(false);
        }
    });
</script>
</body>
</html>
