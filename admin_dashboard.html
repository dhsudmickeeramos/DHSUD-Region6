<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHSUD Region VI · Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 1rem; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto; border-radius: 8px; border-top: 5px solid var(--ph-blue); padding: 2rem; position: relative; }
        .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--ph-muted); }
        .close-btn:hover { color: var(--ph-red); }
    </style>
</head>
<body>
<div class="gov-topbar">
    <div class="gov-topbar-inner">
        <span><i class="fas fa-flag"></i> Republic of the Philippines</span>
        <span class="gov-topbar-right">DHSUD Region VI · Admin Dashboard</span>
    </div>
</div>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <img src="https://raw.githubusercontent.com/dhsudmickeeramos/DHSUD-Region6/main/DHSUD_LOGO.png" alt="Logo" class="gov-logo">
            <div class="logo-text">
                <h1>Admin Dashboard</h1>
                <p>Welcome, Administrator</p>
            </div>
        </div>
        <div class="nav-menu">
            <a href="admin_dashboard.html" class="btn-secondary active-nav"><i class="fas fa-users"></i> Manage Employees</a>
            <button onclick="logout()" class="btn-secondary" style="border-color: var(--ph-red); color: var(--ph-red);"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>

    <div class="gold-bar"></div>

    <div class="table-card">
        <div class="table-header">
            <h2><i class="fas fa-list-ul"></i> Employee Records</h2>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search...">
                <button class="btn-primary" onclick="openModal()" style="padding: 0.5rem 1rem; font-size: 0.85rem;"><i class="fas fa-plus"></i> Add Employee</button>
                <button class="btn-secondary" onclick="fetchEmployees()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>
        <table id="employeeTable">
            <thead>
                <tr>
                    <th>EMPLOYEE NO.</th>
                    <th>Complete Name</th>
                    <th>Email Address</th>
                    <th>Position</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr class="empty-row"><td colspan="5" style="text-align: center;">Loading employees...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL FORM -->
<div id="employeeModal" class="modal-overlay">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
        <h2><i class="fas fa-user-plus"></i> Add New Employee</h2>
        <form id="employeeForm">
            <div class="form-grid">
                <div class="section-label">Personal Information</div>
                <div class="form-group"><label>Complete Name</label><input type="text" id="fullName" required></div>
                <div class="form-group"><label>Email Address (For Login)</label><input type="email" id="email" required></div>
                <div class="form-group"><label>Address</label><input type="text" id="address" required></div>
                <div class="form-group"><label>Birthday</label><input type="date" id="birthday" required></div>
                <div class="form-group"><label>Blood Type</label><input type="text" id="bloodType"></div>
                <div class="form-group"><label>Contact Number</label><input type="text" id="contactNo" required></div>
                <div class="form-group"><label>Emergency Person</label><input type="text" id="emergencyPerson" required></div>
                <div class="form-group"><label>Emergency No.</label><input type="text" id="emergencyNo" required></div>

                <div class="section-label">Employment Information</div>
                <div class="form-group"><label>Position</label><input type="text" id="position" required></div>
                <div class="form-group"><label>Salary Grade</label><input type="text" id="salaryGrade" required></div>
                <div class="form-group"><label>Salary</label><input type="number" id="salary" required></div>
                <div class="form-group"><label>Division</label><input type="text" id="division" required></div>
                <div class="form-group"><label>Employment Status</label><input type="text" id="employmentStatus" required></div>
                <div class="form-group"><label>Start Date</label><input type="date" id="startDate" required></div>
                <div class="form-group"><label>Profession</label><input type="text" id="profession"></div>
                <div class="form-group"><label>PRC No.</label><input type="text" id="prcNo"></div>

                <div class="section-label">Government Numbers</div>
                <div class="form-group"><label>GSIS No.</label><input type="text" id="gsisNo"></div>
                <div class="form-group"><label>SSS No.</label><input type="text" id="sssNo"></div>
                <div class="form-group"><label>TIN No.</label><input type="text" id="tinNo"></div>
                <div class="form-group"><label>Pag-IBIG No.</label><input type="text" id="pagibigNo"></div>
                <div class="form-group"><label>PhilHealth No.</label><input type="text" id="philhealthNo"></div>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn-primary" id="saveBtn"><i class="fas fa-save"></i> Save Employee & Create Account</button>
            </div>
        </form>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const API_URL = 'https://script.google.com/macros/s/AKfycbyXu6iWw1Bp4TqR9toiWbCjGRhwKAkMrzSqBB0x6diHP36lz4Imk0LLRx77nbWstIZ6jw/exec';

    let allEmployees = [];

    async function checkAuth() {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        const { data: roleData } = await supabase.from('user_roles').select('role').eq('id', session.user.id).single();
        if (roleData.role !== 'admin') { window.location.href = 'employee_dashboard.html'; }
    }

    async function logout() {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
    }

    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.className = `toast ${type} show`;
        toast.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function openModal() {
        document.getElementById('employeeModal').classList.add('active');
        document.getElementById('employeeForm').reset();
    }

    function closeModal() {
        document.getElementById('employeeModal').classList.remove('active');
    }

    async function fetchEmployees() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5" style="text-align:center;"><i class="fas fa-circle-notch fa-spin"></i> Loading...</td></tr>';
        try {
            const res = await fetch(`${API_URL}?action=list`);
            const json = await res.json();
            if (json.success) {
                allEmployees = json.data || [];
                renderTable(allEmployees);
            }
        } catch (err) {
            showToast('Error loading data', 'error');
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        if (data.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="5" style="text-align:center;">No employees found.</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(emp => `
            <tr>
                <td><strong>${emp['EMPLOYEE NO.'] || ''}</strong></td>
                <td>${emp['Complete Name'] || ''}</td>
                <td>${emp['Email Address'] || ''}</td>
                <td>${emp['Position'] || ''}</td>
                <td>${emp['Employment Status'] || ''}</td>
            </tr>
        `).join('');
    }

    // Handle Form Submission
    document.getElementById('employeeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Creating Account...';

        const payload = {
            action: 'add',
            'Complete Name': document.getElementById('fullName').value,
            'Email Address': document.getElementById('email').value,
            'Address': document.getElementById('address').value,
            'Birthday': document.getElementById('birthday').value,
            'Blood Type': document.getElementById('bloodType').value,
            'Contact Number': document.getElementById('contactNo').value,
            'Emergency Person': document.getElementById('emergencyPerson').value,
            'Emergency No.': document.getElementById('emergencyNo').value,
            'Position': document.getElementById('position').value,
            'Salary Grade': document.getElementById('salaryGrade').value,
            'Salary': document.getElementById('salary').value,
            'Division': document.getElementById('division').value,
            'Employment Status': document.getElementById('employmentStatus').value,
            'Start Date': document.getElementById('startDate').value,
            'Profession': document.getElementById('profession').value,
            'PRC No.': document.getElementById('prcNo').value,
            'GSIS No.': document.getElementById('gsisNo').value,
            'SSS No.': document.getElementById('sssNo').value,
            'TIN No.': document.getElementById('tinNo').value,
            'Pag-IBIG No.': document.getElementById('pagibigNo').value,
            'PhilHealth No.': document.getElementById('philhealthNo').value
        };

        try {
            const body = new URLSearchParams(payload);
            const res = await fetch(API_URL, { method: 'POST', body });
            const json = await res.json();
            
            if (json.success) {
                showToast(`Success! Created Account for ${payload['Complete Name']}. Default Password: DHSUD@2026`, 'success');
                closeModal();
                fetchEmployees();
            } else {
                showToast('Failed: ' + json.message, 'error');
            }
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> Save Employee & Create Account';
        }
    });

    // Search functionality
    document.getElementById('searchBox').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = allEmployees.filter(emp => 
            String(emp['Complete Name']).toLowerCase().includes(q) || 
            String(emp['EMPLOYEE NO.']).toLowerCase().includes(q)
        );
        renderTable(filtered);
    });

    document.addEventListener('DOMContentLoaded', async () => {
        await checkAuth();
        fetchEmployees();
    });
</script>
</body>
</html>
