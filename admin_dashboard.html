<!-- Inside admin_dashboard.html -->
<!-- Update the Add/Edit Form to include the Email field -->
<form id="employeeForm">
    <input type="hidden" id="empId">
    <div class="form-grid">
        <div class="form-group"><label>Complete Name</label><input type="text" id="fullName" required></div>
        <div class="form-group"><label>Email Address (For Login)</label><input type="email" id="email" required></div>
        <div class="form-group"><label>Position</label><input type="text" id="position" required></div>
        <div class="form-group"><label>Division</label><input type="text" id="division" required></div>
        <!-- Add other fields as needed -->
    </div>
    <div style="display: flex; gap: 1rem; margin-top: 1rem;">
        <button type="submit" class="btn-primary" id="saveBtn"><i class="fas fa-save"></i> Save Employee</button>
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
</form>
